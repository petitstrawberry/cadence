[dependencies]
scarlet-std = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", optional = true }

[lib]
name = "sws_protocol"
path = "src/lib.rs"
