[package]
name = "cadence-library"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["all-meta", "aac", "aiff", "alac", "caf", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[dev-dependencies]
hound = "3.5"

[lints]
workspace = true
