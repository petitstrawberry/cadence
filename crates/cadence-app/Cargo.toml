[package]
name = "cadence"
version.workspace = true
edition.workspace = true

[dependencies]
cadence-core = { path = "../cadence-core" }
cadence-platform = { path = "../cadence-platform" }
cadence-library = { path = "../cadence-library" }
cadence-sources = { path = "../cadence-sources" }
cadence-effects = { path = "../cadence-effects" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "eede18df956fa4599027f783266c5879d1afe564", default-features = false, features = ["std", "platform-winit"] }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "eede18df956fa4599027f783266c5879d1afe564", default-features = false, features = ["std", "platform-sws"] }

[build-dependencies]
toml = "=1.1.2"

[lints]
workspace = true
