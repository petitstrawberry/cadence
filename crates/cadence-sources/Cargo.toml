[package]
name = "cadence-sources"
version.workspace = true
edition.workspace = true

[dependencies]
cadence-core = { path = "../cadence-core" }
cadence-library = { path = "../cadence-library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
roxmltree = "=0.20.0"
sha2 = "=0.10.9"
ureq = { version = "=2.12.1", default-features = false }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
p12-keystore = "=0.4.1"
zeroize = "=1.9.0"

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
x509-parser = "=0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"

[target.'cfg(target_os = "scarlet")'.dependencies]
getrandom = "=0.4.3"
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca" }

[lints]
workspace = true
